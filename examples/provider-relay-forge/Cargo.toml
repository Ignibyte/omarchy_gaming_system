[package]
name = "relay-forge-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[features]
default = []
conformance = ["omarchygs-provider-starter/conformance"]

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
ed25519-dalek = "2.2.0"
omarchygs-provider-sdk = "0.1.0"
omarchygs-provider-starter = "0.1.0"
rustix = { version = "1.1.4", features = ["fs", "process"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.24.1", features = ["serde", "v4"] }
zeroize = "1.9.0"
