[package]
name = "door-legends-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[features]
default = []
conformance = []

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
ed25519-dalek = "2.2.0"
omarchy-game-provider = { version = "0.1.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.24.1", features = ["serde", "v4"] }
zeroize = "1.9.0"
