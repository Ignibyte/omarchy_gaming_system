[package]
name = "omarchy-game-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["platform"]
platform = [
    "dep:futures-util",
    "dep:reqwest",
    "dep:rustls",
    "dep:sqlx",
    "dep:tokio",
    "dep:tracing",
]
provider-conformance = ["platform", "dep:axum", "dep:axum-server", "dep:rcgen", "dep:tempfile"]

[dependencies]
axum = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
base64.workspace = true
ed25519-dalek.workspace = true
futures-util = { workspace = true, optional = true }
http.workspace = true
omarchygs-provider-sdk = { path = "../provider-sdk" }
rcgen = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
tempfile = { version = "3.23.0", optional = true }
tokio = { workspace = true, features = ["fs", "process"], optional = true }
tracing = { workspace = true, optional = true }
url.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.23.0"

[[bin]]
name = "omarchygs-provider-admin"
path = "src/bin/omarchygs-provider-admin.rs"
required-features = ["platform"]

[[bin]]
name = "omarchygs-provider-fixture"
path = "src/bin/omarchygs-provider-fixture.rs"
required-features = ["provider-conformance"]
