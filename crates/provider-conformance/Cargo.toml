[package]
name = "omarchygs-provider-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Portable public OmarchyGS provider conformance and developer-kit tooling"
repository = "https://github.com/Ignibyte/omarchy_gaming_system"
license-file = "kit/v1/LICENSES.md"

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
http.workspace = true
omarchygs-provider-sdk = { version = "0.1.0", path = "../provider-sdk" }
reqwest.workspace = true
rustls.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }
url.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }
zeroize.workspace = true

[dev-dependencies]
tempfile = "3.23.0"

[[bin]]
name = "omarchygs-provider-conformance"
path = "src/main.rs"
