[workspace]

[package]
name = "omarchygs-server-module-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
uuid = { version = "1.24.1", features = ["serde", "v4"] }
wasmtime = { version = "48.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
wat = "1.258.0"
wit-component = "0.254.0"
wit-parser = "0.254.0"

[dev-dependencies]
tempfile = "3.23"
