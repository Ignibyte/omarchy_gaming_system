[workspace]
members = [
    "crates/client-cartridge-runtime",
    "crates/game-cartridge",
    "crates/game-cartridge-renderer",
    "crates/game-provider",
    "crates/game-runtime",
    "crates/game-signal-siege",
    "crates/marketplace-publisher",
    "crates/marketplace-trust",
    "crates/provider-sdk",
    "crates/provider-conformance",
    "crates/provider-starter",
    "crates/server",
    "crates/server-module-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
crc32fast = "1.5.0"
data-encoding = "2.11.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
http = "1.4.0"
futures-util = "0.3.34"
http-body-util = "0.1"
percent-encoding = "2.3.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.14.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = { version = "0.11.0", features = ["zeroize"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
uuid = "1.24.1"
wasmtime = { version = "48.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wat = "1.258.0"
wit-component = "0.254.0"
wit-parser = "0.254.0"
url = "2.5.7"
zeroize = "1.9.0"
zip = { version = "8.6.0", default-features = false }
