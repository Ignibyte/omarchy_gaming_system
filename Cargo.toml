[workspace]
members = ["crates/game-runtime", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
data-encoding = "2.11.1"
hmac = { version = "0.13.0", features = ["zeroize"] }
futures-util = "0.3.34"
http-body-util = "0.1"
percent-encoding = "2.3.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = { version = "0.11.0", features = ["zeroize"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.24.1"
zeroize = "1.9.0"
