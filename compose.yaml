services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: omarchy_gaming_system
      POSTGRES_USER: omarchy_gaming_system
      POSTGRES_PASSWORD: omarchy_gaming_system
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omarchy_gaming_system -d omarchy_gaming_system"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ogs_postgres_data:/var/lib/postgresql

volumes:
  ogs_postgres_data:
