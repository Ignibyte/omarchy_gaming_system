services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: omarchy_bbs
      POSTGRES_USER: omarchy_bbs
      POSTGRES_PASSWORD: omarchy_bbs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omarchy_bbs -d omarchy_bbs"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bbs_postgres_data:/var/lib/postgresql

volumes:
  bbs_postgres_data:
